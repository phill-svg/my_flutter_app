name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA for AltStore/SideStore sideloading
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r my_flutter_app-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: my_flutter_app-unsigned
          path: my_flutter_app-unsigned.ipa
          retention-days: 14
